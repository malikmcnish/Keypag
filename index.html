<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keypag</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/mediaqueries.css">
</head>

<body>
    <nav id="desktop-nav">
        <div class="logo">Keypag</div>
        <div>

            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#experience">Experience</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </nav>
    <nav id="hamburger-nav">
        <div class="logo">Keypag</div>
        <div class="hamburger-menu">
            <div class="hamburger-icon" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="menu-links">
                <!-- <ul> -->
                <li><a href="#about" onclick="toggleMenu()">About</a></li>
                <li><a href="#experience" onclick="toggleMenu()">Experience</a></li>
                <li><a href="#projects" onclick="toggleMenu()">Projects</a></li>
                <li><a href="#contact" onclick="toggleMenu()">Contact</a></li>
                <!-- </ul> -->
            </div>
        </div>
    </nav>
    <section id="profile">
        <div class="section__pic-container">
            <img src="./assets/profile-pic.png" alt="Profile Picture" class="section__pic">
        </div>
        <div class="section__text">
            <p class="section__text__p1">Hello</p>
            <h1 class="title">Malik</h1>
            <p class="section__text__p2">Frontend Developer</p>
            <div class="btn-container">
                <button class="btn btn-color-2" onclick="window.open('./assets/resume-example.pdf')">Download
                    Resume</button>
                <button class="btn btn-color-1" onclick="location.href='./#contact'">Contact Me</button>
            </div>
            <div id="social-container">
                <img src="./assets/linkedin.png" alt="LinkedIn Icon" class="icon"
                    onclick="location.href='https://google.com'">
                <img src="./assets/github.png" alt="GitHub Icon" class="icon"
                    onclick="location.href='https://github.com'">
            </div>
        </div>
    </section>


    <script src="/main.js"></script>
</body>

</html>
